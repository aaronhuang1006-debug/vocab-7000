<title>學測七千單字查詢</title>

<style>
/* Layout: one reading column; a six-step level ladder runs through the page as the only colour system. */
:root{
  --bg:#f4f6f7; --surface:#ffffff; --fg:#17262d; --muted:#5b6b72; --line:#d9e1e4; --soft:#e9eef0;
  --accent:#1d5a6b; --accent-fg:#ffffff;
  --l1:#cfe6e3; --l2:#a6d3cf; --l3:#6fb6b4; --l4:#3f8f99; --l5:#2a6878; --l6:#1b4555;
  --l1-fg:#17262d; --l2-fg:#17262d; --l3-fg:#0f2328; --l4-fg:#ffffff; --l5-fg:#ffffff; --l6-fg:#ffffff;
  --warn:#8a5a12; --warn-bg:#fbf1df;
  --lp:#e8c37a; --lp-fg:#3d2a05;
  --f-head:"Literata",Georgia,"Noto Serif TC",serif;
  --f-body:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Noto Sans CJK TC",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --surface:#162125; --fg:#e4ecee; --muted:#93a5ab; --line:#2a3a3f; --soft:#1d2a2e;
  --accent:#7cc4c8; --accent-fg:#0f1719;
  --l1:#2b3f40; --l2:#2f5252; --l3:#33696a; --l4:#3c8389; --l5:#5aa3ab; --l6:#8ccbd0;
  --l1-fg:#e4ecee; --l2-fg:#e4ecee; --l3-fg:#e4ecee; --l4-fg:#ffffff; --l5-fg:#0f1719; --l6-fg:#0f1719;
  --warn:#f0c27a; --warn-bg:#2e2617; --lp:#c99a3e; --lp-fg:#1a1205; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719; --surface:#162125; --fg:#e4ecee; --muted:#93a5ab; --line:#2a3a3f; --soft:#1d2a2e;
  --accent:#7cc4c8; --accent-fg:#0f1719;
  --l1:#2b3f40; --l2:#2f5252; --l3:#33696a; --l4:#3c8389; --l5:#5aa3ab; --l6:#8ccbd0;
  --l1-fg:#e4ecee; --l2-fg:#e4ecee; --l3-fg:#e4ecee; --l4-fg:#ffffff; --l5-fg:#0f1719; --l6-fg:#0f1719;
  --warn:#f0c27a; --warn-bg:#2e2617; --lp:#c99a3e; --lp-fg:#1a1205; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-direction:column;gap:10px}
h1{font-family:var(--f-head);font-weight:700;font-size:clamp(22px,4.4vw,30px);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:.01em}
.sub{color:var(--muted);font-size:13.5px;margin:0}
.ladder{display:flex;gap:4px;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.ladder button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0;height:48px;border:0;border-radius:8px;cursor:pointer;font:inherit;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12);transition:transform .12s}
.ladder button:hover{transform:translateY(-1px)}
.ladder button[aria-current="true"]{outline:2px solid var(--fg);outline-offset:2px}
.ladder b{font-weight:500;font-size:11px;opacity:.8}
.ladhint{margin:-4px 0 0;font-size:12.5px;color:var(--muted)}
.search{position:relative}
.search input{width:100%;font:500 20px/1.3 var(--f-head);padding:14px 16px 14px 46px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(10,30,40,.14);z-index:5;overflow:hidden;max-height:340px;overflow-y:auto}
.sugg button{display:flex;width:100%;align-items:center;gap:10px;padding:9px 14px;border:0;background:none;color:var(--fg);font:15px var(--f-body);text-align:left;cursor:pointer}
.sugg button[aria-selected="true"],.sugg button:hover{background:var(--soft)}
.sugg .sw{font-family:var(--f-head);font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv{display:inline-flex;align-items:center;font:500 11.5px/1 var(--f-mono);padding:4px 7px;border-radius:5px;letter-spacing:.04em;white-space:nowrap}
.lv1{background:var(--l1);color:var(--l1-fg)}.lv2{background:var(--l2);color:var(--l2-fg)}.lv3{background:var(--l3);color:var(--l3-fg)}
.lv4{background:var(--l4);color:var(--l4-fg)}.lv5{background:var(--l5);color:var(--l5-fg)}.lv6{background:var(--l6);color:var(--l6-fg)}
.lv0{background:var(--soft);color:var(--muted)}
.lvP{background:var(--lp);color:var(--lp-fg)}
.ladder .lvP{flex:1.15}
.phw{align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px clamp(16px,4vw,30px);display:flex;flex-direction:column;gap:22px;min-width:0}
.headrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 14px}
.hw{font-family:var(--f-head);font-weight:700;font-size:clamp(30px,7vw,42px);line-height:1.1;margin:0;word-break:break-word}
.lvs{display:flex;gap:6px;flex-wrap:wrap}
.lvs .lv{font-size:13px;padding:6px 9px}
.variants{color:var(--muted);font-size:13.5px;width:100%;margin-top:-4px}
.speak{flex:none;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);cursor:pointer;padding:0;align-self:center}
.speak svg{width:19px;height:19px;fill:currentColor;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.speak svg .w{fill:none}
.speak:hover{border-color:var(--accent)}
.speak.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.ex .speak{width:30px;height:30px}
.ex .speak svg{width:16px;height:16px}
.exrow{display:flex;align-items:flex-start;gap:10px}
.exrow .en{flex:1;min-width:0}
.demo{font:500 11.5px var(--f-mono);color:var(--muted);border:1px dashed var(--line);border-radius:5px;padding:3px 7px;margin-left:auto}
section h3{font:500 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.senses{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.senses li{display:grid;grid-template-columns:28px 1fr;gap:2px 10px;counter-increment:s}
.senses li::before{content:counter(s);font:500 13px var(--f-mono);color:var(--muted);padding-top:3px;grid-row:span 2}
.sline{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;min-width:0}
.pos{font:500 13px var(--f-mono);color:var(--accent)}
.zh{font-size:16.5px;font-weight:500}
.note{color:var(--muted);font-size:13.5px;min-width:0}
.ex{border-left:3px solid var(--accent);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:4px}
.ex .en{font-family:var(--f-head);font-size:17px;line-height:1.55}
.ex .en mark{background:none;color:var(--accent);font-weight:700}
.ex .cn{color:var(--muted);font-size:14px}
.rel{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--bg);color:var(--fg);font:14px var(--f-body);text-align:left;max-width:100%}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--accent)}
.chip .cw{font-family:var(--f-head);font-weight:500}
.chip .ct{font-size:12px;color:var(--muted)}
.chip .lv{font-size:10.5px;padding:3px 5px}
.root{display:flex;flex-direction:column;gap:10px}
.parts{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.part{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:8px;padding:7px 12px;min-width:64px;background:var(--bg)}
.part .p{font:500 15px var(--f-mono);color:var(--accent)}
.part .m{font-size:13px}
.plus{align-self:center;color:var(--muted);font-family:var(--f-mono)}
.rootx{font-size:14.5px;margin:0}
.fam{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.none{color:var(--muted);font-size:14px;margin:0}
.state{display:flex;flex-direction:column;gap:10px}
.sk{height:14px;border-radius:5px;background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.msg{font-size:14px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:10px 12px;margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:500 13.5px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-top:12px}
.miss h2{font-family:var(--f-head);font-size:24px;margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* ---------- level word list ---------- */
.lvhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.lvhead h2{font-family:var(--f-head);font-size:26px;margin:0;display:flex;align-items:center;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--fg);font:500 13.5px var(--f-body);padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.az{display:flex;flex-wrap:wrap;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--surface);padding:6px 0;border-bottom:1px solid var(--line)}
.az button{width:30px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:500 13px var(--f-mono);cursor:pointer;padding:0}
.az button:hover{border-color:var(--accent);color:var(--accent)}
.wl{list-style:none;margin:0;padding:0}
.wl li{border-top:1px solid var(--line);content-visibility:auto;contain-intrinsic-size:auto 56px}
.wl li:first-child{border-top:0}
.wl .letter{font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.12em;padding:14px 0 4px;border-top:0;scroll-margin-top:52px}
.wl button{display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:2px 12px;width:100%;background:none;border:0;padding:10px 0;text-align:left;color:var(--fg);cursor:pointer;font:inherit}
.wl button:hover .ww{color:var(--accent)}
.ww{font-family:var(--f-head);font-weight:700;font-size:16.5px;overflow-wrap:anywhere}
.ww .sv{color:#d69e2e;font-size:13px;margin-left:4px}
.wz{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.wc{font:500 12px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}
.wc.z{color:var(--line)}
.rank{font:500 12px var(--f-mono);color:var(--muted);min-width:2.2em;display:inline-block}
.lvtools{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 14px;font:500 13.5px var(--f-body);cursor:pointer}
.chk .box{width:16px;height:16px;border:1.5px solid var(--muted);border-radius:4px;display:inline-flex;align-items:center;justify-content:center}
.chk[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.chk[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.chk[aria-pressed="true"] .box::after{content:"";width:8px;height:4px;border-left:2px solid var(--accent-fg);border-bottom:2px solid var(--accent-fg);transform:rotate(-45deg) translate(1px,-1px)}
.backlv{align-self:flex-start;background:none;border:0;padding:0;color:var(--accent);font:500 14px var(--f-body);cursor:pointer}
.backlv:hover{text-decoration:underline}
@media (max-width:480px){.ladder b{display:none}.ladder button{height:42px}.wl button{grid-template-columns:1fr auto}.wz{grid-column:1/-1;order:3}}
/* ---------- word book / review ---------- */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tbtn{display:inline-flex;align-items:center;gap:8px;font:500 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 14px;cursor:pointer;min-height:38px}
.tbtn:hover{border-color:var(--accent)}
.tbtn b{font:500 12.5px var(--f-mono);font-variant-numeric:tabular-nums;background:var(--soft);border-radius:999px;padding:2px 8px}
.tbtn .due{font:500 12px var(--f-body);color:var(--accent-fg);background:var(--accent);border-radius:999px;padding:2px 8px}
.tbtn.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tbtn.on b{background:color-mix(in srgb,var(--accent-fg) 22%,transparent)}
.tbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.star{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;padding:0 12px;font:500 13px var(--f-body);align-self:center}
.star svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.star[aria-pressed="true"]{color:#b7791f;border-color:color-mix(in srgb,#d69e2e 55%,var(--line));background:color-mix(in srgb,#f6e05e 18%,var(--surface))}
.star[aria-pressed="true"] svg{fill:#ecc94b;stroke:#b7791f}
.bhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.bhead h2{font-family:var(--f-head);font-size:26px;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.stat b{font:500 22px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.blist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.blist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.blist li:first-child{border-top:0}
.bopen{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;background:none;border:0;padding:0;text-align:left;color:var(--fg);cursor:pointer;font:inherit}
.bopen .bw{display:flex;align-items:center;gap:8px;font-family:var(--f-head);font-weight:700;font-size:17px}
.bopen .bz{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font:500 11.5px var(--f-body);border-radius:999px;padding:2px 8px;white-space:nowrap}
.pill.due{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.pill.learn{background:var(--soft);color:var(--muted)}
.pill.done{background:color-mix(in srgb,#38a169 16%,transparent);color:#2f855a}
.bdel{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1}
.bdel:hover{border-color:var(--line);color:var(--fg)}
.empty{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.empty p{margin:0;color:var(--muted)}
.backup{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.backup h3{margin:0}
.backup textarea{width:100%;min-height:76px;font:12.5px/1.4 var(--f-mono);border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);color:var(--fg);resize:vertical;word-break:break-all}
.okmsg{font-size:13.5px;color:#2f855a;margin:0}
.rv{display:flex;flex-direction:column;gap:18px}
.rvtop{display:flex;align-items:center;justify-content:space-between;gap:10px;font:500 13px var(--f-mono);color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.fc{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:26px 8px 8px}
.fc .hw{font-size:clamp(34px,9vw,48px)}
.fc .row{justify-content:center}
.back{display:flex;flex-direction:column;gap:16px;border-top:1px dashed var(--line);padding-top:18px}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grade .btn{padding:13px 10px;font-size:16px;border-radius:10px}
.btn.big{padding:13px 18px;font-size:16px;border-radius:10px;width:100%}
.btn.no{border-color:color-mix(in srgb,#c05621 45%,var(--line));color:#c05621}
.btn.yes{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.done h2{font-family:var(--f-head);font-size:26px;margin:0}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(8,20,26,.55);display:flex;align-items:flex-end;justify-content:center;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.sheet .panel{background:var(--surface);color:var(--fg);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow-y:auto}
.sheet h2{font-family:var(--f-head);font-size:21px;margin:0}
.sheet ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.sheet p{margin:0;color:var(--muted);font-size:14px}
.ico{display:inline-flex;vertical-align:-4px;width:22px;height:22px;border:1px solid var(--line);border-radius:6px;align-items:center;justify-content:center;background:var(--bg)}
.ico svg{width:15px;height:15px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lineBar{display:flex;flex-direction:column;gap:6px}
h1 a{color:inherit;text-decoration:none}

function parseFile(txt, lvl) {

    if (!lines.length) continue;

    const hm = hm0 && [hm0[0], hm0[1], hm0[2] || hm0[3]];

      } else if (ln.startsWith("相關:") || ln.startsWith("相關：")) {

const b64e = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

function rvTop() {

  return `<div class="rvtop"><span>複習 ${Math.min(s.done + 1, s.total)} / ${s.total}</span><button class="btn" type="button" data-act="endrv">結束</button></div><div class="bar"><i style="width:${pct}%"></i></div>`;
}
async function flipCard() {
  const s = session; if (!s || s.flipped) return; s.flipped = true;
  const key = s.cur, r = await fetchEntry(key, IDX.get(key));
  const d = r.data;
  const senses = d ? `<ol class="senses">${d.senses.slice(0, 4).map(x => `<li><div class="sline"><span class="pos">${esc(x.pos)}</span><span class="zh">${esc(x.zh)}</span></div>${x.note ? `<div class="note">${esc(x.note)}</div>` : ""}</li>`).join("")}</ol>` : `<p class="none">這個字只有級別資料。</p>`;
  const ex = d && d.example && d.example.en ? `<div class="ex"><div class="exrow"><div class="en">${markWord(d.example.en, key)}</div>${speakBtn(d.example.en, "唸出例句")}</div><div class="cn">${esc(d.example.zh)}</div></div>` : "";
  document.getElementById("rvBack").innerHTML = `<div class="back">${senses}${ex}<div class="grade"><button class="btn no" type="button" data-act="again">還不會</button><button class="btn yes" type="button" data-act="good">會了</button></div></div>`;
}
function grade(ok) {
  const s = session, it = book[s.cur];
  if (it) {
    if (ok) { it.b = (it.b || 0) + 1; it.d = it.b >= 4 ? null : addDays(INTERVAL[it.b]); s.right++; }
    else { it.b = 0; it.d = today(); s.again++; s.queue.push(s.cur); s.total++; }
    saveBook();
  }
  s.done++; nextCard();
}
function finishReview() {
  const s = session; session = null; setView("review");
  out.innerHTML = `<article class="card done"><h2>今天的複習完成了</h2><p class="none">答對 ${s.right} 次，還不會 ${s.again} 次。答錯的字明天會再出現；會了的字會隔 1 天、3 天、7 天再出現，連續答對 3 次就算熟記。</p><div class="row"><button class="btn primary" type="button" data-act="tobook">回單字本</button></div></article>`;
  updateBookBtn();
}
function onAct(a, el) {
  if (a === "root") { showRoot(el.dataset.p, el.dataset.from); return; }
  if (a === "rootback") { const k = el.dataset.k; q.value = k; show(k); window.scrollTo({ top: 0 }); return; }
  if (a === "gobackup") { document.querySelector(".backup")?.scrollIntoView({ block: "start" }); return; }
  if (a === "exall") { el.closest(".exams")?._all?.(); return; }
  if (a === "lvopen") { const fromLv = view === "level"; if (fromLv && levelCtx) levelCtx.y = window.scrollY; q.value = el.dataset.k; show(el.dataset.k, { fromLevel: fromLv }); window.scrollTo({ top: 0 }); return; }
  if (a === "backlv") { const b = backTo; if (b) showLevel(b.l, { sort: b.sort, tested: b.tested, restore: true, y: b.y }); return; }
  if (a === "lvsort") { if (levelCtx) showLevel(levelCtx.l, { sort: el.dataset.sort }); return; }
  if (a === "lvtested") { if (levelCtx) showLevel(levelCtx.l, { tested: !levelCtx.tested }); return; }
  if (a === "lvjump") { document.getElementById("lv-" + el.dataset.l)?.scrollIntoView({ block: "start" }); return; }
  if (a === "review") return startReview();
  if (a === "flip") return flipCard();
  if (a === "good") return grade(true);
  if (a === "again") return grade(false);
  if (a === "endrv" || a === "tobook") { session = null; return showBook(); }
  if (a === "open") { setView("lookup"); q.value = el.dataset.k; show(el.dataset.k); window.scrollTo({ top: 0 }); return; }
  if (a === "del") { delete book[el.dataset.k]; saveBook(); return showBook(); }
  if (a === "mkbackup") { flags.lastBackup = today(); flags.backupN = Object.keys(book).length; lsSet(FLAG, flags); document.getElementById("bkOut").hidden = false; const t = document.getElementById("bkCode"); t.value = makeCode(); t.focus(); t.select(); return; }
  if (a === "copy") {
    const t = document.getElementById("bkCode"), m = document.getElementById("copyMsg");
    const fallback = () => { t.focus(); t.select(); m.textContent = "已選取代碼，請長按或按 ⌘C／Ctrl+C 複製。"; };
    try { navigator.clipboard.writeText(t.value).then(() => { m.textContent = "已複製，貼到 LINE 傳給自己存起來。"; }, fallback); } catch { fallback(); }
    return;
  }
  if (a === "restore") {
    const m = document.getElementById("rsMsg");
    try { const r = restoreCode(document.getElementById("rsCode").value); showBook(`還原完成：新增 ${r.added} 個字${r.updated ? `，更新 ${r.updated} 個字的進度` : ""}。`); }
    catch (e) { m.textContent = e.message; }
  }
}

/* ---------- install to phone (PWA) ---------- */
const UA = navigator.userAgent || "";
const IS_IOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const IS_ANDROID = /Android/i.test(UA);
const IN_LINE = /\bLine\//.test(UA);
const STANDALONE = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const PWA = (location.protocol === "https:" && /\.github\.io$/.test(location.hostname)) || location.hostname === "localhost";
let installEvt = null;
const installBtn = document.getElementById("installBtn");
const sheet = document.getElementById("sheet"), sheetPanel = document.getElementById("sheetPanel");
const SHARE = '<span class="ico"><svg viewBox="0 0 24 24"><path d="M12 15V3m-4 4 4-4 4 4"/><path d="M6 11H5v10h14V11h-1"/></svg></span>';
const PLUS = '<span class="ico"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></svg></span>';
function iosGuide(fromStar) {
  return `<h2>${fromStar ? "先把網站加到主畫面" : "安裝到 iPhone"}</h2>
    ${fromStar ? "<p>iPhone 的 Safari 會清掉 7 天沒開的網站資料。加入主畫面之後，單字本就不會被清掉，還能像 App 一樣打開、沒有網路也能查。</p>" : ""}
    <ol><li>點 Safari 下方的「分享」${SHARE}</li><li>往下滑，點「加入主畫面」${PLUS}</li><li>點右上角「新增」</li></ol>
    <p>之後請從主畫面的「七千單字」圖示打開，單字本才會在同一個地方。</p>
    <button class="btn primary big" type="button" data-close>知道了</button>`;
}
const androidGuide = () => `<h2>安裝到 Android 手機</h2><ol><li>點 Chrome 右上角的「⋮」</li><li>點「安裝應用程式」或「加到主畫面」</li><li>點「安裝」</li></ol><p>安裝後從主畫面的「七千單字」圖示打開，單字本不會遺失，沒有網路也能查。</p><button class="btn primary big" type="button" data-close>知道了</button>`;
const lineGuide = () => `<h2>請先用瀏覽器開啟</h2><p>LINE 裡面的瀏覽器不能把網站加入主畫面，單字本也可能跟一般瀏覽器分開存。</p><ol><li>點右上角的「⋯」</li><li>點「用預設瀏覽器開啟」</li><li>在 Safari 或 Chrome 裡再按一次「安裝到手機」</li></ol><button class="btn primary big" type="button" data-close>知道了</button>`;
function openSheet(html) { sheetPanel.innerHTML = html; sheet.hidden = false; sheetPanel.querySelector("button")?.focus(); }
function closeSheet() { sheet.hidden = true; }
sheet.addEventListener("click", e => { if (e.target === sheet || e.target.closest("[data-close]")) closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !sheet.hidden) closeSheet(); });
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (PWA && !STANDALONE) installBtn.hidden = false; });
window.addEventListener("appinstalled", () => { installBtn.hidden = true; installEvt = null; });
installBtn.addEventListener("click", async () => {
  if (IN_LINE) return openSheet(lineGuide());
  if (installEvt) { installEvt.prompt(); try { await installEvt.userChoice; } catch {} installEvt = null; return; }
  openSheet(IS_IOS ? iosGuide(false) : androidGuide());
});
if (PWA && !STANDALONE && (IS_IOS || IS_ANDROID || IN_LINE)) installBtn.hidden = false;
if (PWA && IN_LINE) document.getElementById("lineBar").hidden = false;
if (PWA && "serviceWorker" in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(reg => {
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
  }).catch(() => {}));
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController) document.getElementById("updBar").hidden = false; });
}
document.getElementById("updBtn").addEventListener("click", () => location.reload());
if (PWA && STANDALONE && !Object.keys(book).length && !flags.appTip) {
  flags.appTip = 1; lsSet(FLAG, flags);
  setTimeout(() => openSheet(`<h2>歡迎使用七千單字 App</h2><p>主畫面 App 的單字本和 Safari 是分開存的。如果你之前在 Safari 存過單字：</p><ol><li>回到 Safari 打開這個網站，進「單字本」</li><li>按「產生備份代碼」並複製</li><li>回到這個 App 的「單字本」，貼上代碼按「還原」</li></ol><p>之後請都從主畫面的圖示打開。</p><button class="btn primary big" type="button" data-close>知道了</button>`), 600);
}
updateBookBtn();

/* ---------- usage statistics (GoatCounter; off until GC_CODE is set) ---------- */
const GC_CODE = "vocab7000";
function track(path, title) {
  try { if (GC_CODE && PWA && window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path, title: title || path, event: true }); } catch {}
}
if (GC_CODE && PWA) {
  const s = document.createElement("script"); s.async = true; s.src = "https://gc.zgo.at/count.js";
  s.dataset.goatcounter = `https://${GC_CODE}.goatcounter.com/count`; document.head.appendChild(s);
}

/* ---------- keep the word book safe ---------- */
let persistAsked = false;
function askPersist() {
  if (persistAsked) return; persistAsked = true;
  try { navigator.storage && navigator.storage.persist && navigator.storage.persisted().then(p => p || navigator.storage.persist()).catch(() => {}); } catch {}
}
if (Object.keys(book).length) askPersist();
function bookNotices(n) {
  const out = [];
  if (PWA && IS_IOS && !STANDALONE && !IN_LINE && n)
    out.push(`<p class="notice">你現在是用 Safari 開啟。加入主畫面之後，App 裡的單字本是空的；請先在這裡「產生備份代碼」，再到 App 裡「還原」。</p>`);
  const days = flags.lastBackup ? Math.floor((new Date(today()) - new Date(flags.lastBackup)) / 864e5) : null;
  const grown = n - (flags.backupN || 0);
  if (n >= 15 && (days === null || (days >= 14 && grown > 0) || grown >= 30))
    out.push(`<p class="notice"><span>${days === null ? `單字本已經有 ${n} 個字，還沒備份過。` : `距離上次備份 ${days} 天，多了 ${grown} 個字。`}建議備份一下，換手機或資料被清掉時才救得回來。</span><button class="btn" type="button" data-act="gobackup">去備份</button></p>`);
  return out.join("");
}

/* ---------- browse by word root ---------- */
const normPart = p => String(p || "").toLowerCase().replace(/[‐‑–—]/g, "-").replace(/\s+/g, "").trim();
let ROOTS = null;
async function rootIndex() {
  if (ROOTS) return ROOTS;
  await Promise.all([1, 2, 3, 4, 5, 6].map(loadLevel));
  ROOTS = new Map();
  for (const e of E) {
    if (e.l === "P") continue;
    const d = DATA.get(e.w + "|" + e.l); if (!d || !d.root) continue;
    for (const part of d.root.parts) {
      const k = normPart(part.p); if (!k || k.length < 2) continue;
      if (!ROOTS.has(k)) ROOTS.set(k, []);
      ROOTS.get(k).push({ e, key: norm(e.keys[0]), m: part.m, zh: [...new Set(d.senses.flatMap(s => s.zh.split("；")))].slice(0, 4).join("；") });
    }
  }
  return ROOTS;
}
async function showRoot(part, fromKey) {
  track("root-" + part, "字根 " + part);
  setView("root"); session = null; backTo = null; hideSugg(); markLevel(""); seq++;
  const my = seq;
  out.innerHTML = `<article class="card"><div class="state"><div class="sk" style="width:50%"></div><p class="note">載入中⋯</p></div></article>`;
  window.scrollTo({ top: 0 });
  const idx = await rootIndex(); if (my !== seq) return;
  const list = (idx.get(part) || []).slice().sort((a, b) => a.e.l - b.e.l || a.e.w.localeCompare(b.e.w, "en", { sensitivity: "base" }));
  const seen = new Set(), rows = list.filter(r => !seen.has(r.key) && seen.add(r.key));
  const means = {}; rows.forEach(r => { if (r.m) means[r.m] = (means[r.m] || 0) + 1; });
  const top = Object.entries(means).sort((a, b) => b[1] - a[1]).slice(0, 3).map(x => x[0]);
  const kind = /-$/.test(part) ? "字首" : /^-/.test(part) ? "字尾" : "字根";
  out.innerHTML = `<article class="card">
    ${fromKey ? `<button class="backlv" type="button" data-act="rootback" data-k="${esc(fromKey)}">← 回到 ${esc(fromKey)}</button>` : ""}
    <div class="lvhead"><h2>${kind} ${esc(part)}</h2></div>
    ${top.length ? `<div class="rootm">${top.map(m => `<span>${esc(m)}</span>`).join("")}</div>` : ""}
    <p class="note">七千單字裡共有 ${rows.length} 個字的字根拆解含有「${esc(part)}」，依級別排列。點單字看完整解釋。</p>
    <ul class="wl">${rows.map(r => `<li><button type="button" data-act="lvopen" data-k="${esc(r.key)}"><span class="ww">${esc(r.e.w)}</span><span class="wz">${esc(r.zh)}</span>${lvBadge(r.e.l)}</button></li>`).join("")}</ul></article>`;
}

/* ---------- home, back-to-top, scroll position ---------- */
function goHome() {
  session = null; backTo = null; lastKey = null; setView("lookup"); markLevel(""); q.value = ""; hideSugg(); seq++;
  try { history.replaceState(null, "", location.pathname + location.search); } catch {}
  showDemo(); window.scrollTo({ top: 0 }); updateFloat();
}
document.getElementById("homeBtn").addEventListener("click", goHome);
document.getElementById("homeLink").addEventListener("click", e => { e.preventDefault(); goHome(); });
const floatNav = document.getElementById("floatNav"), posPill = document.getElementById("posPill");
document.getElementById("toTop").addEventListener("click", () => window.scrollTo({ top: 0, behavior: window.scrollY > 2500 || matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }));
let floatTick = false;
function updateFloat() {
  floatTick = false;
  if (view !== "level" || window.scrollY < 480) { floatNav.hidden = true; return; }
  floatNav.hidden = false;
  const az = out.querySelector(".az");
  const probeY = (az ? Math.max(0, az.getBoundingClientRect().bottom) : 0) + 14;
  const el = document.elementFromPoint(Math.min(window.innerWidth / 2, 200), probeY);
  const li = el && el.closest && el.closest("li[data-i]");
  if (!li || !levelCtx) { posPill.hidden = true; return; }
  posPill.hidden = false;
  const total = (levelCtx.total || 0).toLocaleString();
  posPill.innerHTML = levelCtx.sort === "freq" ? `第 ${(+li.dataset.i).toLocaleString()} 名／${total}` : `<b>${esc(li.dataset.lt)}</b>${(+li.dataset.i).toLocaleString()}／${total}`;
}
window.addEventListener("scroll", () => { if (!floatTick) { floatTick = true; requestAnimationFrame(updateFloat); } }, { passive: true });

/* ---------- start ---------- */
const DEMO = {"senses":[{"pos":"v.","zh":"運送；運輸","level":3,"note":"transport A to B 把 A 運到 B"},{"pos":"n.","zh":"運輸；交通工具","level":3,"note":"public transport 大眾運輸（英式；美式多用 transportation）"}],
 "example":{"en":"Trucks transport fresh vegetables from the farms to the city markets every morning.","zh":"卡車每天早上把新鮮蔬菜從農場運到城市的市場。"},
 "related":[{"w":"transportation","type":"衍生字","zh":"運輸；交通工具"},{"w":"carry","type":"同義字","zh":"搬運"},{"w":"transfer","type":"易混淆字","zh":"轉移；轉乘"},{"w":"passport","type":"衍生字","zh":"護照"},{"w":"export","type":"同義字","zh":"輸出；出口"}],
 "root":{"parts":[{"p":"trans-","m":"橫越、轉移"},{"p":"port","m":"攜帶、運送"}],"explain":"把東西「帶著橫越」到另一個地方，就是運送。","family":["export","import","portable","report"]}};
function showDemo() {
  const key = "transport", entries = IDX.get(key);
  out.innerHTML = `<article class="card">${headHTML(key, entries, true)}${bodyHTML(key, DEMO)}</article>`;
  fillExams(key);
}
function fromHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  const lm = h.match(/^L([1-6P])$/);
  if (lm) { showLevel(lm[1] === "P" ? "P" : +lm[1]); return true; }
  if (h && IDX.has(norm(h))) { q.value = norm(h); show(norm(h), { keepHash: true }); return true; }
  return false;
}
if (!fromHash()) showDemo();
window.addEventListener("hashchange", fromHash);
/* 背景預載各級資料：使用者還在打字時就先下載，第一次查詢不必等 */
const prefetchAll = () => { for (let l = 1; l <= 6; l++) loadLevel(l); loadLevel("P"); loadExams(); };
q.addEventListener("focus", prefetchAll, { once: true });
if ("requestIdleCallback" in window) requestIdleCallback(prefetchAll, { timeout: 1500 }); else setTimeout(prefetchAll, 300);
